<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px;
        }
        .login-card h2 {
            font-weight: 700;
            color: #1a1a2e;
        }
        .login-card .subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .form-control:focus {
            border-color: #2c5364;
            box-shadow: 0 0 0 0.2rem rgba(44, 83, 100, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #203a43, #2c5364);
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #0f2027, #203a43);
        }
        #errorAlert {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem; color: #2c5364;"></i>
        </div>
        <h2 class="text-center">Smart Attendance</h2>
        <p class="subtitle text-center">Sign in to your account</p>

        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span id="errorMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="you@college.edu" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100" id="loginBtn">
                <span id="loginText">Sign In</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // If already logged in, redirect based on role
        const existingToken = localStorage.getItem('token');
        const existingRole  = localStorage.getItem('role');
        if (existingToken && existingRole) {
            redirectByRole(existingRole);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('loginBtn');

            // Show spinner
            document.getElementById('loginText').classList.add('d-none');
            document.getElementById('loginSpinner').classList.remove('d-none');
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    showError(data.message || 'Login failed.');
                    return;
                }

                // Store token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('role',  data.user.role);
                localStorage.setItem('userName', data.user.name);
                localStorage.setItem('userId', data.user.id);

                // Redirect based on role
                redirectByRole(data.user.role);

            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                document.getElementById('loginText').classList.remove('d-none');
                document.getElementById('loginSpinner').classList.add('d-none');
                btn.disabled = false;
            }
        });

        function redirectByRole(role) {
            switch (role) {
                case 'admin':   window.location.href = '/pages/adminDashboard.html';   break;
                case 'teacher': window.location.href = '/pages/teacherDashboard.html'; break;
                case 'student': window.location.href = '/pages/studentDashboard.html'; break;
                default:        showError('Unknown role.');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            document.getElementById('errorMessage').textContent = msg;
            el.style.display = 'block';
            el.classList.add('show');
        }
    </script>
</body>
</html>
